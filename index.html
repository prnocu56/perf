<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17110e">
<title>D-Joy // Kayıt 001</title>
<style>
:root{--amber:#e7a34d;--gold:#ffd18a;--ink:#090909;--panel:rgba(15,12,11,.94);--paper:#f2d8a9}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#090807;color:var(--paper);font-family:Consolas,"Courier New",monospace}
body{overflow:hidden}
button{font:inherit}
#app{height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#2c1c12 0%,#090807 72%);padding:12px}
#game{position:relative;width:min(100%, calc((100dvh - 24px)*1.7778));aspect-ratio:16/9;max-height:calc(100dvh - 24px);overflow:hidden;background:#120d09;border:1px solid #77502b;box-shadow:0 0 0 3px #1a100a,0 0 36px #9b5b2033}
#scene{position:absolute;inset:0}
#background{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.88) contrast(1.05)}
#shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent 46%),linear-gradient(90deg,rgba(0,0,0,.15),transparent 65%);pointer-events:none}
#topline{position:absolute;left:2.3%;right:2.3%;top:2.8%;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(9px,1.05vw,14px);color:#f3c27a;text-shadow:0 2px 4px #000}
#status{display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#e34b37;box-shadow:0 0 9px #e34b37;display:inline-block}
#dialogue{position:absolute;left:3%;right:3%;bottom:3%;min-height:23%;background:linear-gradient(135deg,rgba(14,11,10,.97),rgba(26,17,12,.96));border:1px solid #b77a37;box-shadow:inset 0 0 0 2px #362316,0 5px 22px #0008;padding:clamp(12px,2.1vw,27px) clamp(14px,2.4vw,32px) clamp(16px,2vw,25px);display:flex;flex-direction:column;gap:10px}
#dialogue:before{content:"";position:absolute;inset:5px;border:1px solid #604126;pointer-events:none}
#speaker{position:relative;z-index:1;align-self:flex-start;border:1px solid #a56f37;background:#24170e;padding:5px 14px;color:var(--gold);font-weight:bold;letter-spacing:.12em;font-size:clamp(10px,1.1vw,14px);margin-top:-2px}
#text{position:relative;z-index:1;white-space:pre-line;line-height:1.55;font-size:clamp(12px,1.42vw,19px);color:#f3dfbd;max-width:100%;overflow:auto}
#controls{position:absolute;right:4.3%;bottom:4.6%;display:flex;gap:8px;align-items:center}
.control{position:relative;z-index:2;border:1px solid #a9763c;background:#21160f;color:#f8d79e;padding:9px 14px;cursor:pointer;transition:.15s}
.control:hover,.control:focus-visible{background:#4a2c17;outline:1px solid #ffcf7e}
#choices{position:absolute;right:5%;bottom:30%;display:none;flex-direction:column;gap:8px;width:min(31%,340px)}
.choice{border:1px solid #b98243;background:#17100ced;color:#f6d7a2;padding:12px;text-align:left;cursor:pointer;box-shadow:0 3px 12px #0007}
.choice:hover,.choice:focus-visible{background:#51341c;outline:1px solid #f9c879}
#recordCard{display:none;position:absolute;inset:10% 12% 31%;border:1px solid #d39a51;background:linear-gradient(140deg,#24170feF,#0c0b0bee);box-shadow:0 0 0 4px #24170eaa,0 0 35px #000b;padding:clamp(16px,3vw,38px);text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#recordCard h2{font-size:clamp(16px,2.2vw,28px);margin:0;color:#ffd18a;letter-spacing:.08em}
#recordCard p{margin:0;line-height:1.5;font-size:clamp(11px,1.3vw,17px)}
#recordCard .recordIcon{font-size:clamp(28px,4vw,52px);filter:drop-shadow(0 0 10px #d98e37)}
#recordControls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
#footer{position:absolute;left:2.5%;top:auto;bottom:1.2%;font-size:clamp(8px,.75vw,11px);letter-spacing:.1em;color:#d6a76e99;pointer-events:none}
#scanlines{position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#000 4px);mix-blend-mode:multiply}
#toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);display:none;padding:9px 13px;background:#130d09;border:1px solid #b77a37;color:#f3d3a0;font-size:12px;max-width:90%;text-align:center}
@media(max-width:600px){#app{padding:0}#game{width:100%;max-height:none;height:100dvh;aspect-ratio:auto;border:0}#background{object-fit:cover}#dialogue{bottom:2%;left:2%;right:2%;min-height:29%;padding:12px 13px 18px;gap:7px}#text{font-size:14px;max-height:35dvh}#choices{width:65%;right:4%;bottom:34%}.choice{padding:10px;font-size:12px}#recordCard{inset:13% 5% 36%}#footer{display:none}}
</style>
</head>
<body>
<div id="app">
  <main id="game" aria-label="D-Joy görsel romanı">
    <div id="scene"><img id="background" src="Frame1.png" alt="Eski, loş radyo odası"><div id="shade"></div></div>
    <div id="topline"><span>9/B · ARŞİV KAYDI 001</span><span id="status"><i class="dot"></i><span id="statusText">hocam cok ozur dilerim yapacaktım ancak zaten geçikmişti sesler hiç ortama uygun değil</span></span></div>
    <div id="choices">
      <button class="choice" id="yes">▶ Evet, başlat.</button>
      <button class="choice" id="no">Hayır, belki sonra.</button>
    </div>
    <section id="recordCard" aria-live="polite">
      <div class="recordIcon">◉</div>
      <h2>ARŞİV KAYDI 001</h2>
      <p>Bir kayıt bulundu.<br>Ses dosyası: <strong>txt.wav</strong></p>
      <p id="audioState">Kayıt hazır. Dinlemek için başlat düğmesine bas.</p>
      <div id="recordControls">
        <button class="control" id="playAudio">▶ Kaydı oynat</button>
        <button class="control" id="pauseAudio">Ⅱ Duraklat</button>
        <button class="control" id="continueAfter">Devam et →</button>
      </div>
    </section>
    <section id="dialogue">
      <div id="speaker">ANLATICI</div>
      <div id="text">Bir gün, hiçliğin ortasında bir oda görürsün...</div>
      <div id="controls"><button class="control" id="next">İLERLE ▸</button></div>
    </section>
    <div id="footer">...</div>
    <div id="scanlines"></div><div id="toast"></div>
    <audio id="recordAudio" src="txt.wav" preload="metadata"></audio>
  </main>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const bg = $('background'), speaker = $('speaker'), text = $('text');
  const next = $('next'), choices = $('choices'), card = $('recordCard');
  const statusText = $('statusText'), audio = $('recordAudio');
  let page = 0, recordFinished = false, audioStarted = false;

  // Metinler görsellerin içine gömülü değildir; HTML üzerinden çizilir.
  const pages = [
    {img:'Frame1.png', speaker:'ANLATICI', status:'SİSTEM BEKLEMEDE',
     text:'Bir gün hiçliğin ortasında bir oda görürsün. İçinde kapanmış bir robot, bir masa ve masanın üstünde ekranlı bir radyoya benzeyen bir cihaz vardır. Robotun üzerinde, havada duran ve çok yüksek enerji yayan belirsiz bir cisim dönmektedir.\n\nBunu boşverip ekrana yönelirsin. Açma-kapama tuşuna bastığında robotun ekranı yanıp sönmeye, havadaki cisim daha hızlı dönmeye başlar. Bir anda robot, antenlerinin arasında manyetik alanla tuttuğu maddeyle konuşmaya başlar.'},
    {img:'Frame2.png', speaker:'D-JOY', status:'SİNYAL ALGILANDI',
     text:'Se-e-la-am, be-e-n D-Joy. Şi-i-i--mdi, herh-aaangi bi- ya-a-a-yyın (...) görremi-İyorum. a-aa-a-ancak bibi-r    ad-e-eet kayı-ı-ıt var, di-lemek isterrr mis-ini?'},
    {img:'Frame3.png', speaker:'D-JOY', status:'SEÇİM BEKLENİYOR',
     text:'Kayıt arşivde duruyor. Başlatma komutunu bekliyorum.' , choices:true},
    {img:'Frame4.png', speaker:'ARŞİV KAYDI 001', status:'KAYIT AÇILDI',
     text:'Kayıt 001 başlatılıyor.' , audioCard:true},
    {img:'Frame5.png', speaker:'D-JOY', status:'KAYIT TAMAMLANDI',
     text:'”\n\nD-Joy: “b-b-b-b-bu yu-u-u-sufa ba-ayılı-ı-yor-u”'}
  ];

  function showToast(message) {
    const toast = $('toast'); toast.textContent = message; toast.style.display = 'block';
    clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.style.display='none', 2800);
  }
  function render() {
    const p = pages[page];
    bg.src = p.img; bg.alt = p.img.replace('.png','');
    speaker.textContent = p.speaker; text.textContent = p.text;
    statusText.textContent = p.status;
    choices.style.display = p.choices ? 'flex' : 'none';
    card.style.display = p.audioCard ? 'flex' : 'none';
    $('controls').style.display = p.audioCard ? 'none' : 'flex';
    next.style.display = p.choices || p.audioCard ? 'none' : 'inline-block';
    if (p.audioCard) {
      $('audioState').textContent = 'txt.wav aranıyor…';
      audio.load();
      audio.onloadedmetadata = () => $('audioState').textContent = 'Kayıt hazır. Dinlemek için başlat düğmesine bas.';
      audio.onerror = () => $('audioState').textContent = 'txt.wav bulunamadı. Dosyayı index.html ile aynı klasöre koy.';
    }
  }
  function advance() {
    if (page < pages.length - 1) { page++; render(); }
  }
  next.addEventListener('click', advance);
  $('yes').addEventListener('click', () => { page = 3; render(); });
  $('no').addEventListener('click', () => { showToast('Kayıt beklemede. İstersen İLERLE ile devam edebilirsin.'); choices.style.display='none'; next.style.display='inline-block'; });
  $('playAudio').addEventListener('click', async () => {
    try { await audio.play(); audioStarted = true; $('audioState').textContent = 'Kayıt oynatılıyor…'; statusText.textContent='KAYIT OYNATILIYOR'; }
    catch(e) { $('audioState').textContent = 'Ses başlatılamadı. txt.wav dosyasının adını ve konumunu kontrol et.'; }
  });
  $('pauseAudio').addEventListener('click', () => { audio.pause(); $('audioState').textContent='Kayıt duraklatıldı.'; statusText.textContent='KAYIT DURAKLATILDI'; });
  $('continueAfter').addEventListener('click', () => { audio.pause(); page = 4; render(); });
  audio.addEventListener('ended', () => { $('audioState').textContent='Kayıt sona erdi. Devam edebilirsin.'; statusText.textContent='KAYIT TAMAMLANDI'; });
  document.addEventListener('keydown', e => {
    if ((e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') && !pages[page].choices && !pages[page].audioCard) { e.preventDefault(); advance(); }
  });
  render();
})();
</script>
</body>
</html>
